description = "Add your description here"
readme = "README.md"
authors = [
    { name = "INCRED_99", email = "devpathak9801@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-tavily>=0.2.18",
